}

  --ground:#17231f; --grid:#ffffff10; --water:#1c3b52; --tree:#2a4934; --rock:#3a3d3a;

  --ok:#3fc77a; --warn:#f0b52c; --bad:#ff5c4f; --idle:#8a9aa6; --pole:#f0c25a; color-scheme:dark}}

  --bg:#0d1419; --panel:#121b21; --card:#18242c; --ink:#e6edf1; --ink2:#9fb0bc; --line:#26353f; --accent:#ff7a3d; --accent-ink:#1a0d06; --accent-soft:#3a2216;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-b);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px;gap:12px;min-height:0}
header.top{display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap}
header.top h1{font:700 22px/1.1 var(--font-d);margin:0;letter-spacing:.2px}
header.top p{margin:0;color:var(--ink2);flex:1 1 280px;min-width:0}
header.top .meta{font:500 12px var(--font-m);color:var(--ink2)}
.main{flex:1;min-height:0;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(340px,410px);grid-template-rows:minmax(0,1fr)}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(250px,50%) minmax(0,1fr)}}
.mapwrap{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ground);touch-action:none}
svg#map{display:block;width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.drag{cursor:grabbing}
.tools{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.tools>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 10px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:99px;font-size:12.5px;font-weight:500;backdrop-filter:blur(4px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--sw,var(--ink2));display:inline-block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center}
.readout{position:absolute;left:10px;bottom:10px;font:500 11.5px var(--font-m);background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);padding:3px 8px;border-radius:6px;color:var(--ink2);display:flex;gap:10px}
.hint{position:absolute;left:50%;top:52px;transform:translateX(-50%);max-width:min(420px,calc(100% - 24px));background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;display:flex;gap:10px;align-items:flex-start;z-index:3}
.hint button{background:none;border:0;color:inherit;font-size:16px;line-height:1;padding:0 2px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:4px 8px;border-radius:6px;max-width:260px;display:none}
/* panel */
.panel{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:10px 4px;border:0;background:none;font:600 13px var(--font-d);color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.scroll{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
h2{font:700 17px/1.2 var(--font-d);margin:0}
h3{font:600 13px/1.2 var(--font-d);margin:0;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2)}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 12px;font-weight:500;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.s-ok{--c:var(--ok)}.s-warn{--c:var(--warn)}.s-bad{--c:var(--bad)}.s-idle{--c:var(--idle)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--font-m);font-size:12px}
.muted{color:var(--ink2)}
.lead{font-size:14.5px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:600 12px var(--font-m);display:grid;place-items:center;padding:0}
.dot[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:500;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px}
.mini:hover,.link:hover{filter:brightness(1.15)}
.rt{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 10px;align-items:start;text-align:left;width:100%}
.rt .sw{width:14px;height:14px;border-radius:4px;background:var(--rc);margin-top:3px}
.rt b{font:600 14px var(--font-d)}
.gl{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tile b{display:block;font:700 22px var(--font-d)}
.tile span{font-size:12px;color:var(--ink2)}
.note{border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13px}
/* mapa */
.water{fill:var(--water)}.tree{fill:var(--tree)}.rock{fill:var(--rock)}
.zone{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-dasharray:1.2 .8;stroke-width:.22}
.zone.on{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-opacity:1;stroke-width:.4}
.belt{stroke:var(--belt);stroke-linecap:round;fill:none}
.bi-coal{stroke:var(--bi-coal)}.bi-copper-ore{stroke:var(--bi-copper-ore)}.bi-iron-ore{stroke:var(--bi-iron-ore)}.bi-copper-plate{stroke:var(--bi-copper-plate)}.bi-iron-plate{stroke:var(--bi-iron-plate)}.bi-stone{stroke:var(--bi-stone)}
.arrow{fill:none;stroke:var(--bg);stroke-width:.14;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.mach{stroke:var(--ink);stroke-opacity:.35;stroke-width:.1}
.st-on .mach.s-ok{stroke:var(--ok);stroke-opacity:1;stroke-width:.22}
.st-on .mach.s-warn{stroke:var(--warn);stroke-opacity:1;stroke-width:.22}
.st-on .mach.s-bad{stroke:var(--bad);stroke-opacity:1;stroke-width:.28}
.glyph{stroke:#101820;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.ins-line{stroke:var(--ink);stroke-opacity:.5;stroke-width:.1;fill:none}
.pole{fill:var(--pole);stroke:var(--ink);stroke-opacity:.5;stroke-width:.06}
.wire{stroke:var(--pole);stroke-width:.07;stroke-dasharray:.3 .2;fill:none;opacity:.9}
.supply{fill:var(--pole);fill-opacity:.07;stroke:var(--pole);stroke-opacity:.3;stroke-width:.05}
.lbl{font-family:var(--font-d);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--ground);stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.sel-ring{fill:none;stroke:var(--accent);stroke-width:.35;pointer-events:none}
.link-line{stroke:var(--accent);stroke-width:.2;fill:none;stroke-dasharray:.6 .4;pointer-events:none}
.rline{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rline.casing{stroke:#0b141a;stroke-opacity:.72}
.rflow{fill:none;stroke:#fff;stroke-opacity:.9;stroke-width:.16;stroke-dasharray:.35 .85;stroke-linecap:round;pointer-events:none;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-1.2}}
@media (prefers-reduced-motion:reduce){.rflow{animation:none}.pulse{animation:none!important}}
.pulse{fill:none;stroke:var(--accent);stroke-width:.35;pointer-events:none;animation:pl 1s ease-in-out 3}
@keyframes pl{50%{stroke-opacity:.2;stroke-width:.8}}
svg.dim .belt{opacity:.35}svg.dim .mach,svg.dim .inslay{opacity:.4}
svg.dim .inv{opacity:1}
[data-id]{cursor:pointer}
.hi-only{display:none}
svg.zhi .hi-only{display:inline}
svg.hide-res .l-res,svg.hide-belts .l-belts,svg.hide-mach .l-mach,svg.hide-ins .l-ins,svg.hide-power .l-power,svg.hide-labels .l-labels{display:none}
.l-power{display:none}svg.show-power .l-power{display:inline}
.legend-dots{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px}
.legend-dots span{display:inline-flex;gap:5px;align-items:center}
.legend-dots i{width:12px;height:12px;border-radius:3px;display:inline-block}
@media (max-width:700px){header.top p{display:none}header.top h1{font-size:19px}.tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tools::-webkit-scrollbar{display:none}.tools .chip{flex:none;padding:2px 9px;font-size:12px}.hint{top:50px}}

 {t:'Lo que hay bajo el suelo',h:`<p>Los cuadrados de colores son <b>recursos</b> enterrados: hierro, cobre, carbón y piedra. Cuanto más oscuro el cuadrado, más cantidad hay debajo.</p><div class="legend-dots"><span><i style="background:var(--r-iron)"></i>Hierro</span><span><i style="background:var(--r-copper)"></i>Cobre</span><span><i style="background:var(--r-coal)"></i>Carbón</span><span><i style="background:var(--r-stone)"></i>Piedra</span></div><p class="muted">Cada recurso tiene su mina en una zona distinta, y están separadas unas 100 casillas entre sí.</p>`,fit:'all'},
 {t:'Carbón: el combustible',zone:'carbon',route:'carbon',h:`<p>Nueve <b>taladros de combustión</b> sacan carbón. Los hornos, las calderas y los propios taladros lo queman para funcionar.</p><p class="muted">Casi todos están parados, y es buena señal: las cintas y un cofre están llenos, así que se produce más carbón del que se gasta.</p>`},
 {t:'El carbón se reparte',zone:null,route:'carbon',focus:[24,-5.5,12],h:`<p>Desde la mina, el carbón sale por una cinta. En el <b>divisor</b> (el bloque gris) la línea se parte en dos: una va hacia la zona del hierro y otra baja hasta las calderas de la central eléctrica.</p><p class="muted">Otra parte hace un círculo por los hornos de cobre y vuelve a la mina.</p>`},
 {t:'Cobre: mineral, hornos y placas',zone:'cobre',route:'cobre',h:`<p>Dos <b>taladros eléctricos</b> sacan mineral de cobre y lo dejan en una cinta. La cinta pasa por encima de cuatro <b>hornos</b> que lo funden en placas. Cuatro <b>inserters largos</b> (brazos mecánicos) sacan las placas a cuatro cofres. Todos los brazos de esta zona son eléctricos, así que no se quedan sin combustible.</p><p class="muted">El cobre sirve para cables y circuitos. Fíjate en el punto muerto de la cinta, más a la derecha: el mineral que sobra se queda parado allí.</p>`},
 {t:'Hierro: la materia principal',zone:'hierro',route:'hierro',h:`<p>El hierro es el material más usado. Aquí los taladros dejan el mineral en cofres, unos brazos lo pasan a los hornos y las placas salen por una cinta hasta otro cofre.</p><p class="muted">Hoy está todo lleno: el cofre final guarda 1 600 placas, el máximo que cabe, y por eso los hornos y taladros se paran esperando.</p>`},
 {t:'Electricidad: del carbón a la corriente',zone:'energia',route:'electricidad',h:`<p>La <b>central eléctrica</b> funciona así: las <b>bombas</b> sacan agua del lago, las <b>calderas</b> la calientan quemando carbón, y las <b>máquinas de vapor</b> convierten ese vapor en electricidad. Hay 4 calderas y 8 máquinas.</p><p class="muted">Los <b>postes</b> y sus cables llevan la corriente hasta los taladros eléctricos, los brazos, los laboratorios y el radar.</p>`},
 {t:'Laboratorios: lo que falta',zone:'ciencia',route:'ciencia',h:`<p>Los <b>laboratorios</b> usan paquetes de ciencia para investigar tecnologías nuevas. Aquí hay 3, y están parados: no les llega ningún paquete.</p><p class="muted">El ensamblador de al lado no recibe ingredientes y ninguna cinta conecta esta zona con las minas. Es el punto débil de la base.</p>`},
 {t:'Qué falla y qué sigue',h:`<p>Ya conoces toda la fábrica. En <b>Estado</b> ves qué máquinas están paradas y por qué, y una lista de lo que conviene hacer.</p><div class="row"><button class="btn pri" id="go-est">Ver el estado</button></div><p class="muted">Pulsa «Rutas» para seguir el camino de cada material, o «Cosas» para consultar qué es cada objeto.</p>`,fit:'all'},
];
function goStep(i) {
  tourStep = Math.max(0, Math.min(TOUR.length - 1, i)); const s = TOUR[tourStep];
  selId = null; L.sel.innerHTML = ''; hideTip();
  layers.power = s.route === 'electricidad'; applyLayers();
  setRoute(s.route || null);
  for (const z of document.querySelectorAll('.zone')) z.classList.toggle('on', z.getAttribute('data-zone') === s.zone);
  userMoved = false;
  if (s.zone) fitZone(s.zone); else if (s.focus) { lastSpec = () => ({x: s.focus[0], y: s.focus[1] - TOPPAD / 2 / s.focus[2], s: s.focus[2]}); flyTo(lastSpec()); } else if (s.route && s.route !== 'carbon') { fitRoute(ROUTES.find(x => x.id === s.route)); } else fitAll();
  tab = 'rec'; render();
  const g = $('#go-est'); if (g) g.onclick = () => { setRoute(null); setTab('est'); fitAll(); };
}

/* ---------- arranque ---------- */
$('#meta').textContent = `Datos de la partida · ${(D.tick / 216000).toFixed(1).replace('.', ',')} h de juego`;
new ResizeObserver(resize).observe($('#mapwrap'));
resize(); applyLayers(); fitAll(); goStep(0);
try { if (!localStorage.getItem('atlas-hint')) $('#hint').hidden = false; } catch (e) { $('#hint').hidden = false; }
$('#hint-x').onclick = () => { $('#hint').hidden = true; try { localStorage.setItem('atlas-hint', '1'); } catch (e) {} };
})();
</script>
</body></html>
